name: Windows checkout smoke

on:
  pull_request:
    branches: [codex-native-support, main]
    paths:
      - 'scripts/**'
      - 'extensions/**'
      - 'requirements.txt'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Parse all extension scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem -Path extensions -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Set up the checkout runtime with Git Bash
        shell: bash
        run: |
          export CODEX_SEO_PYTHON="$(command -v python)"
          ./scripts/codex-seo setup --skip-browser
          ./scripts/codex-seo doctor --json
          ./scripts/codex-seo run seo_updates.py --limit 1 --json | python -c 'import json, sys; assert json.load(sys.stdin)["count"] == 1'
      - name: Register and remove an optional skill in PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $PWD 'extensions/firecrawl/install.ps1')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path .agents/skills/seo-firecrawl/SKILL.md)) { throw 'Extension install failed' }
          & (Join-Path $PWD 'extensions/firecrawl/uninstall.ps1')
          if ($LASTEXITCODE -ne 0 -or (Test-Path .agents/skills/seo-firecrawl/SKILL.md)) { throw 'Extension uninstall failed' }
